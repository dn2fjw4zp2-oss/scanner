<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智能扫描官</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#16202b;--mute:#6b7785;--line:#e3e8ef;--long:#2563eb;--short:#d97706;--up:#dc2626;--dn:#16a34a;--warn:#b45309;--warnbg:#fff7e6;--bad:#b91c1c;--badbg:#fdecec;--ok:#15803d;--okbg:#ecfdf3}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--mute:#8b96a5;--line:#2a313c;--long:#60a5fa;--short:#fbbf24;--warnbg:#2b2412;--warn:#fbbf24;--badbg:#2d1717;--bad:#f87171;--ok:#4ade80;--okbg:#10261a}}
:root[data-theme="light"]{}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 40px}
.w{max-width:620px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:0}
.sub{color:var(--mute);font-size:13px;margin:4px 0 12px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 4px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 4px;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.box{border-radius:12px;padding:10px 13px;margin:8px 0;font-size:13.5px;border:1px solid var(--line)}
.box.warn{background:var(--warnbg);color:var(--warn)} .box.bad{background:var(--badbg);color:var(--bad)} .box.ok{background:var(--okbg);color:var(--ok)}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.kpi small{color:var(--mute);display:block;font-size:12px}.kpi b{font-size:17px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card.long{border-left-color:var(--long)}.card.short{border-left-color:var(--short)}.card.alt{opacity:.75}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sym{font-size:20px;font-weight:700}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute)}
.tag.run{background:var(--ink);color:var(--card)}
.lv{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:10px 0}
.lv div{background:var(--bg);border-radius:9px;padding:6px 7px}
.lv small{display:block;color:var(--mute);font-size:11px}.lv b{font-size:16px;font-variant-numeric:tabular-nums}
.lv2{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:0 0 10px}.lv2 div{background:var(--okbg);border-radius:9px;padding:6px 7px}.lv2 small{display:block;color:var(--mute);font-size:11px}.lv2 b{font-size:15px;font-variant-numeric:tabular-nums}
.stop{color:var(--dn)}.tp{color:var(--up)}
.meta{color:var(--mute);font-size:12.5px}
.bt{font-size:12.5px;margin:8px 0;color:var(--mute)}
.why{font-size:12.5px;color:var(--mute)}
.ck{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ck input{width:130px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px}
.msg{font-size:13px;color:var(--mute)}.ok2{color:var(--dn)}.bad2{color:var(--bad)}
.how{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:18px;font-size:13.5px;color:var(--mute)}
.how b{color:var(--ink)}
.ctl{display:flex;gap:8px;margin:8px 0}.ctl button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}.ctl button:disabled{opacity:.5}
.foot{color:var(--mute);font-size:12px;margin-top:18px;line-height:1.7}
</style></head>
<body><div class="w">
<h1>智能扫描官</h1>
<div class="sub" id="sub">加载中…</div>
<div class="tabs">
  <button data-m="all" class="on">综合</button>
  <button data-m="short">短线</button>
  <button data-m="long">长线</button>
</div>
<div class="ctl"><button id="btnRun">▶ 立即扫描</button><button id="btnRef">↻ 刷新结果</button></div>
<div class="msg" id="runmsg"></div>
<div id="top"></div>
<div id="cards"></div>
<div class="how"><b>把它放到手机桌面（像 App 一样）</b><br>
iPhone：用 Safari 打开本页 → 底部「分享」按钮 → 「添加到主屏幕」。<br>
安卓：用 Chrome 打开本页 → 右上角菜单 ⋮ → 「添加到主屏幕」或「安装应用」。</div>
<div class="foot">仅为规则演算，不保证盈利，不构成投资建议。「历史验证」是同一套规则在过去数年数据上的回放结果，未来表现可能完全不同，且未计入手续费、滑点和税费。下单前请在券商 App 里核对现价，偏差超过 2% 就放弃这张单。杠杆和高波动标的可能造成大额亏损，只用你能承受全部损失的钱。</div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=v=>v==null||isNaN(v)?'—':Number(v).toFixed(2);
const pct=v=>v==null?'—':(v*100).toFixed(0)+'%';
let D=null, MODE='all';

function btLine(b){
  if(!b||!b.n) return '历史样本不足';
  return `历史同规则 ${b.n} 次 · 胜率 ${pct(b.win)} · 期望 ${b.avg_r>=0?'+':''}${b.avg_r.toFixed(2)}R`;
}
function card(s, kind){
  const cls=s.side==='做多'?'long':'short';
  const isH=kind!=='all';
  const tagA=isH?`<span class="tag run">持有≤${s.hold}日</span>`:`<span class="tag ${s.role==='执行'?'run':''}">${s.role==='执行'?'执行':'备选'}</span>`;
  const score=isH?'':`<span class="meta" style="margin-left:auto">分数 ${s.score}</span>`;
  const alt=(!isH&&s.role!=='执行')?'alt':'';
  const sizeNote=s.note?`<div class="box warn">${esc(s.note)}</div>`:'';
  return `<div class="card ${cls} ${alt}" data-e="${s.entry}" data-side="${cls}">
    <div class="top"><span class="sym">${esc(s.sym)}</span><span class="tag">${s.side}</span>${tagA}${score}</div>
    <div class="lv"><div><small>进场（涨到≥）</small><b>${f2(s.entry)}</b></div><div><small>止损</small><b class="stop">${f2(s.stop)}</b></div><div><small>止盈1</small><b class="tp">${f2(s.tp1)}</b></div><div><small>数量上限</small><b>${s.qty.toFixed(2)}</b></div></div>
    <div class="meta">止损距离 ${s.stop_pct.toFixed(1)}% · 名义 $${s.notional.toFixed(0)} · 最大亏损 $${s.risk_usd.toFixed(0)}（${s.risk_pct.toFixed(1)}% 本金）</div>
    ${isH?`<div class="lv2"><div><small>执行价上限（超过不追）</small><b>${f2(s.exec_max)}</b></div><div><small>杠杆</small><b>${s.lev}x</b></div><div><small>强平价（参考）</small><b class="tp">${f2(s.liq)}</b></div><div><small>止损离强平价</small><b>${(((s.stop-s.liq)/(s.entry-s.liq))*100).toFixed(0)}%</b></div></div>`:''}
    ${sizeNote}
    <div class="bt">${btLine(s.bt)}</div>
    <div class="why">${esc(s.why)}</div>
    <div class="ck"><input type="number" step="any" inputmode="decimal" placeholder="输入现价" oninput="chk(this)"><span class="msg">未输入现价</span></div>
  </div>`;
}
function bannerBT(b, label){
  if(!b||!b.n) return `<div class="box warn">${label}：历史样本不足，暂不可参考。</div>`;
  const txt=`${label}（合并全部标的）：${b.n} 次 · 胜率 ${pct(b.win)} · 平均 ${b.avg_r>=0?'+':''}${b.avg_r.toFixed(2)}R · 盈亏比 ${b.pf==null?'—':b.pf.toFixed(2)} · 最大回撤 ${b.max_dd_r.toFixed(1)}R`;
  if(b.avg_r<=0) return `<div class="box bad">${txt}<br>历史期望为负或为零，这个周期的信号暂时不建议使用。</div>`;
  if(b.n<30) return `<div class="box warn">${txt}<br>样本偏少，结论不可靠。</div>`;
  return `<div class="box ok">${txt}</div>`;
}
function render(){
  if(!D) return;
  const g=[];
  if(MODE==='all'){
    if(!D.ok){ $('#top').innerHTML=`<div class="box bad">${esc(D.reason)}</div>`; $('#cards').innerHTML=''; return; }
    const reg=D.regime?D.regime.state:'未知';
    const run=D.signals.filter(s=>s.role==='执行').length;
    $('#top').innerHTML=`<div class="kpi"><div><small>大盘</small><b>${esc(reg)}</b></div><div><small>执行</small><b>${run}</b></div><div><small>全部信号</small><b>${D.signals.length}</b></div></div>`+
      (D.failed&&D.failed.length?`<div class="box warn">今天没取到数据的标的：${esc(D.failed.join('、'))}（没出信号不代表没机会）</div>`:'')+
      (D.max_loss_pct>0.1?`<div class="box warn">单笔最大亏损设为 ${(D.max_loss_pct*100).toFixed(0)}%，偏高，建议 5%–10%。</div>`:'');
    $('#cards').innerHTML=D.signals.length?D.signals.map(s=>card(s,'all')).join(''):`<div class="box" style="text-align:center;margin-top:20px">今天没有符合条件的信号。空仓也是一种决定。</div>`;
    return;
  }
  const H=D.horizons&&D.horizons[MODE];
  if(!H){ $('#top').innerHTML=`<div class="box warn">本次数据还没有${MODE==='short'?'短线':'长线'}结果，等下一次自动更新。</div>`; $('#cards').innerHTML=''; return; }
  if(!D.ok){ $('#top').innerHTML=`<div class="box bad">${esc(D.reason)}</div>`; $('#cards').innerHTML=''; return; }
  const reg=D.regime?D.regime.state:'未知';
  $('#top').innerHTML=`<div class="box">${esc(H.desc)}</div>`+
    (reg!=='偏多'?`<div class="box warn">大盘现在是「${esc(reg)}」，本规则要求大盘偏多才出信号，所以下面可能是空的。这是有意为之。</div>`:'')+
    bannerBT(H.bt, H.name+'历史验证');
  $('#cards').innerHTML=H.signals.length?H.signals.map(s=>card(s,MODE)).join(''):`<div class="box" style="text-align:center;margin-top:20px">今天没有${H.name}信号。空仓也是一种决定。</div>`;
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  MODE=b.dataset.m; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); render();
});
const REPO='dn2fjw4zp2-oss/scanner', WF='daily.yml', TOK='scan_gh_token';
const GH={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
function getTok(){try{return localStorage.getItem(TOK)||''}catch(e){return ''}}
function say(t,cls){const m=$('#runmsg');m.textContent=t;m.className='msg '+(cls||'');}
function loadData(){
  return fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
    D=d;
    $('#sub').textContent=d.time?`数据截至 ${d.asof||'—'} · 更新于 ${d.time}（北京时间）`:'';
    render();
  }).catch(()=>{ $('#sub').textContent='无法加载数据，请稍后再试。'; });
}
async function runScan(){
  let t=getTok();
  if(!t){
    t=(prompt('第一次使用：粘贴 GitHub 令牌（只保存在这台手机的浏览器里）')||'').trim();
    if(!t) return;
    try{localStorage.setItem(TOK,t)}catch(e){}
  }
  const btn=$('#btnRun'); btn.disabled=true; say('正在触发扫描…');
  const t0=Date.now();
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WF}/dispatches`,{method:'POST',
      headers:Object.assign({Authorization:'Bearer '+t,'Content-Type':'application/json'},GH),body:JSON.stringify({ref:'main'})});
    if(r.status===204){ say('已触发，约 3–5 分钟后自动刷新结果…','ok2'); pollRun(t0); return; }
    if(r.status===401||r.status===403){ try{localStorage.removeItem(TOK)}catch(e){} }
    say(`触发失败（${r.status}）。令牌无效或没有 Actions 写权限，已清除，请重新点「立即扫描」粘贴正确的令牌。`,'bad2');
  }catch(e){ say('网络错误，稍后再试。','bad2'); }
  btn.disabled=false;
}
async function pollRun(t0){
  const t=getTok(), btn=$('#btnRun');
  for(let k=1;k<=30;k++){
    await new Promise(res=>setTimeout(res,20000));
    try{
      const r=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WF}/runs?per_page=1`,{headers:Object.assign({Authorization:'Bearer '+t},GH)});
      const j=await r.json(); const run=j.workflow_runs&&j.workflow_runs[0];
      if(run&&Date.parse(run.created_at)>=t0-60000&&run.status==='completed'){
        if(run.conclusion==='success'){ say('扫描完成，已刷新结果。','ok2'); await loadData(); }
        else say('扫描失败（'+run.conclusion+'）。到 Actions 页面看日志。','bad2');
        btn.disabled=false; return;
      }
      say(`扫描进行中…（约 ${k*20} 秒）`);
    }catch(e){}
  }
  say('等待超时，请稍后点「刷新结果」。'); btn.disabled=false;
}
$('#btnRun').onclick=runScan;
$('#btnRef').onclick=()=>{ say('正在刷新…'); loadData().then(()=>say('已刷新。')); };
loadData();
function chk(inp){
  const card=inp.closest('.card'), m=inp.nextElementSibling;
  const e=parseFloat(card.dataset.e), p=parseFloat(inp.value), side=card.dataset.side;
  if(!isFinite(p)){m.textContent='未输入现价';m.className='msg';return;}
  const dev=(p-e)/e*100, t='偏差 '+(dev>=0?'+':'')+dev.toFixed(2)+'%';
  if(Math.abs(dev)>2){m.textContent=t+'，超过 2%，这张单作废';m.className='msg bad2';}
  else if(side==='long'&&p>=e){m.textContent=t+'，已越过进场价，条件单会立刻成交';m.className='msg';}
  else{m.textContent=t+'，尚未触发，可以挂单';m.className='msg ok2';}
}
</script></body></html>
